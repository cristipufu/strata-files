name: CI

# Builds Strata and runs its tests (Swift Testing, which comes with Xcode) on every push to main and every pull
# request that touches the code. First, every function that can change a file must be named in
# docs/destructive-actions.md with the tests that cover it.
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Resources/**", "Package.swift", "Package.resolved", "docs/destructive-actions.md", "scripts/audit-destructive.py",
            "scripts/mutate.py", "scripts/build.sh", "scripts/build-icon.py", "scripts/audit-theme-colors.py", "scripts/audit-main-thread.py", "scripts/audit-app-wide.py", "scripts/audit-layers.py", "scripts/swift_source.py", "scripts/run-test-check.py", "AGENTS.md", ".github/workflows/ci.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "Resources/**", "Package.swift", "Package.resolved", "docs/destructive-actions.md", "scripts/audit-destructive.py",
            "scripts/mutate.py", "scripts/build.sh", "scripts/build-icon.py", "scripts/audit-theme-colors.py", "scripts/audit-main-thread.py", "scripts/audit-app-wide.py", "scripts/audit-layers.py", "scripts/swift_source.py", "scripts/run-test-check.py", "AGENTS.md", ".github/workflows/ci.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "26.6"

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every destructive action is listed with its tests
        run: python3 scripts/audit-destructive.py --check

      - name: Main-thread blocking calls are reviewed
        run: python3 scripts/audit-main-thread.py

      - name: No unreviewed use of an app-wide instance outside the application's own code
        run: python3 scripts/audit-app-wide.py

      - name: The model names nothing from the interface
        run: python3 scripts/audit-layers.py

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          swift --version

      - name: Build tooling and safety checks
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Build
        run: swift build --product Strata

      - name: Test
        run: python3 scripts/run-test-check.py --output-directory "$RUNNER_TEMP/strata-test-diagnostics/normal" -- swift test --no-parallel

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-normal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-test-diagnostics/
          retention-days: 3
          if-no-files-found: ignore

  address-sanitizer:
    name: Address Sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          swift --version

      - name: Test with Address Sanitizer
        env:
          ASAN_OPTIONS: handle_abort=1
        run: python3 scripts/run-test-check.py --output-directory "$RUNNER_TEMP/strata-test-diagnostics/address" -- swift test --no-parallel --sanitize address --scratch-path .build/sanitizers/address --disable-automatic-resolution --jobs 4

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-address-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-test-diagnostics/
          retention-days: 3
          if-no-files-found: ignore
