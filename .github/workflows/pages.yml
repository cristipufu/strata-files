name: Website

# Publishes stratafiles.app to GitHub Pages: site/ plus the README's screenshots, assembled by scripts/site.sh.
# Checks pull requests before publishing main to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/release-notes/**"
      - "scripts/site.sh"
      - "scripts/site-assets.py"
      - "scripts/site-localize.py"
      - "Tests/test_site_localization.py"
      - "Localization/*.json"
      - "Tests/site/**"
      - "Tests/test_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/release-notes/**"
      - "scripts/site.sh"
      - "scripts/site-assets.py"
      - "scripts/site-localize.py"
      - "Tests/test_site_localization.py"
      - "Localization/*.json"
      - "Tests/site/**"
      - "Tests/test_site.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tests/site/package-lock.json

      - name: Check asset packaging
        run: python3 -m unittest discover -s Tests -p 'test_site*.py'

      - name: Fetch GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/github-releases.json" 2>/dev/null; then
            echo "SITE_GITHUB_RELEASES=$RUNNER_TEMP/github-releases.json" >> "$GITHUB_ENV"
          fi

      - name: Assemble the site
        env:
          SITE_PREVIOUS_ORIGIN: ${{ github.event_name != 'pull_request' && 'https://stratafiles.app' || '' }}
        run: scripts/site.sh

      - name: Install browser checks
        working-directory: Tests/site
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Check the website
        run: npm test --prefix Tests/site

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
