name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

# Builds Strata.app on a Mac, signs it with the Developer ID certificate, notarizes and staples it, and wraps it in a
# signed, notarized disk image.
#
#   git tag v0.2.0 && git push origin v0.2.0
#       Publishes a GitHub Release with Strata.dmg, Strata.zip and SHA256SUMS.txt. The website's Download button
#       always points at the latest one. A tag with a suffix (v0.2.0-beta.1) is published as a pre-release.
#   Actions tab -> Release -> Run workflow
#       Builds the same files as a workflow artifact. Supply release_tag to retry publishing an existing tag.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   MACOS_CERT_P12        base64 of the "Developer ID Application" certificate and its private key, exported as .p12
#   MACOS_CERT_PASSWORD   the .p12's password
#   MACOS_API_KEY_P8      base64 of an App Store Connect API key (.p8), used to notarize
#   MACOS_API_KEY_ID      that key's ID
#   MACOS_API_ISSUER_ID   its issuer ID
#   MACOS_TEAM_ID         the Apple Developer team ID
#   SPARKLE_ED_PRIVATE_KEY  the EdDSA key that signs updates (scripts: Sparkle's generate_keys -x); its public half
#                           is SUPublicEDKey in Resources/Info.plist. Without it a tag builds no appcast.xml.
# Without them an artifact-only run builds ad-hoc signed, for testing only. Publishing requires the signing secrets:
# Gatekeeper refuses an unsigned app on any other Mac.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty for an artifact only)
        type: string
        default: ""
      retention_days:
        description: Days to keep the artifact
        type: string
        default: "3"

# Least privilege: only the release job can write, and only to releases.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  # macOS 26 SDK with Swift 6.2+ (the summaries use the 26.4 SDK's token counting).
  XCODE_VERSION: "26.6"
  # Secrets can't be read in an `if:`, so their presence is evaluated once here and tested as a string.
  HAS_APPLE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
  HAS_UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
  # Sparkle's command-line tools (sign_update), pinned and checked.
  SPARKLE_VERSION: "2.10.0"
  SPARKLE_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  build:
    runs-on: macos-26
    # Normal, optimized and sanitizer suites all finish before signing and notarization begin.
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}

      - name: Refuse to release an unsigned build
        if: env.RELEASE_TAG != '' && env.HAS_APPLE_SIGNING != 'true'
        run: |
          echo "::error::The signing secrets are not set (see the top of release.yml). A release has to be signed and notarized."
          exit 1

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          swift --version

      # Every publication repeats these checks before it can use signing credentials.
      - name: Require complete and current translations before signing
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tests -p 'test_localization.py'
          python3 scripts/localize.py extract
          if ! git diff --exit-code -- Localization/en.json; then
            echo "::error::Localization/en.json is out of date: run scripts/localize.py extract and translate every new string."
            exit 1
          fi
          python3 scripts/localize.py check --all --complete

      - name: Run all app regressions before signing
        run: python3 scripts/run-test-check.py --output-directory "$RUNNER_TEMP/strata-test-diagnostics/normal" -- swift test --no-parallel

      - name: Run optimized app regressions before signing
        run: python3 scripts/run-test-check.py --output-directory "$RUNNER_TEMP/strata-test-diagnostics/release" -- swift test -c release --no-parallel --disable-automatic-resolution --jobs 4

      - name: Run memory safety checks before signing
        env:
          ASAN_OPTIONS: handle_abort=1
        run: python3 scripts/run-test-check.py --output-directory "$RUNNER_TEMP/strata-test-diagnostics/address" -- swift test --no-parallel --sanitize address --scratch-path .build/sanitizers/address --disable-automatic-resolution --jobs 4

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-test-diagnostics/
          retention-days: 3
          if-no-files-found: ignore

      - name: Work out the version
        id: version
        env:
          # Passed as env, never interpolated into the script, so a tag name can't reach the shell as code.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$(python3 -c 'import plistlib; from pathlib import Path; print(plistlib.loads(Path("Resources/Info.plist").read_bytes())["CFBundleShortVersionString"])')"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"; exit 1; }
          # Info.plist takes the numeric part; the suffix only marks a pre-release.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          if [ -n "$RELEASE_TAG" ]; then ARTIFACT="Strata-$VERSION"; else ARTIFACT="Strata-$VERSION-build$RUN_NUMBER"; fi
          echo "STRATA_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "STRATA_BUILD_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "tag=$RELEASE_TAG"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "artifact=$ARTIFACT"
          } >> "$GITHUB_OUTPUT"
          echo "building Strata $VERSION (build $RUN_NUMBER)"

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign waits on a keychain prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build Strata.app
        run: |
          set -euo pipefail
          STRATA_SIGNING_IDENTITY="${SIGN_IDENTITY:-}" STRATA_KEYCHAIN="${SIGN_KEYCHAIN:-}" STRATA_TIMESTAMP=1 \
            scripts/build.sh release

      - name: Check the app
        run: |
          set -euo pipefail
          APP=build/Strata.app
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Timestamp|Runtime Version)" || true
          echo "version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" \
               "build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          echo "architectures: $(lipo -archs "$APP/Contents/MacOS/Strata")"
          # The command-line tool runs without starting the app: a cheap check that the binaries load.
          "$APP/Contents/Helpers/strata" --help >/dev/null

      - name: Notarize, staple and package
        env:
          API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=build/Strata.app
          mkdir -p dist
          signed=false
          if [ "$HAS_APPLE_SIGNING" = true ]; then signed=true; fi

          if [ "$signed" = true ]; then
            printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api.p8"
            trap 'rm -f "$RUNNER_TEMP/api.p8"' EXIT
            auth=(--key "$RUNNER_TEMP/api.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --team-id "$TEAM_ID")
            # Submits and waits; anything but "Accepted" prints Apple's log and fails the build.
            notarize() {
              local out id status
              out=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 30m --output-format json) || true
              id=$(printf '%s' "$out" | plutil -extract id raw -o - - 2>/dev/null || true)
              status=$(printf '%s' "$out" | plutil -extract status raw -o - - 2>/dev/null || true)
              echo "notarization of $(basename "$1"): ${status:-no answer} ${id}"
              if [ "$status" != Accepted ]; then
                echo "$out"
                [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}" || true
                echo "::error::notarization of $(basename "$1") ended as '${status:-unknown}'"
                return 1
              fi
            }

            # 1. The app itself, stapled, so it also opens offline once copied out of the disk image.
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
            notarize "$RUNNER_TEMP/notarize-app.zip"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl --assess --type execute -vv "$APP"
          else
            echo "::warning::Signing secrets not set: this build is ad-hoc signed and Gatekeeper will refuse it on other Macs. Don't share it."
          fi

          # 2. The disk image: the app next to a link to Applications.
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto "$APP" "$stage/Strata.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Strata -srcfolder "$stage" -fs HFS+ -format UDZO -ov dist/Strata.dmg
          if [ "$signed" = true ]; then
            codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" dist/Strata.dmg
            notarize dist/Strata.dmg
            xcrun stapler staple dist/Strata.dmg
            xcrun stapler validate dist/Strata.dmg
            spctl --assess --type open --context context:primary-signature -vv dist/Strata.dmg
          fi

          # 3. The stapled app as a zip, for people who'd rather not mount an image.
          ditto -c -k --keepParent "$APP" dist/Strata.zip
          (cd dist && shasum -a 256 Strata.dmg Strata.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh dist

      # The update window shows these notes: HTML from GitHub's Markdown renderer, which also sanitizes it.
      - name: Render the release notes for the update window
        if: env.RELEASE_TAG != '' && env.HAS_APPLE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            gh api markdown -f mode=markdown -F text=@"$notes" > "$RUNNER_TEMP/notes.html"
            # It goes inside a CDATA section; anything that could end it falls back to the link.
            if grep -q ']]>' "$RUNNER_TEMP/notes.html"; then rm "$RUNNER_TEMP/notes.html"; fi
          fi

      - name: Sign the update and write the appcast
        if: env.RELEASE_TAG != '' && env.HAS_APPLE_SIGNING == 'true'
        env:
          UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HAS_UPDATE_KEY" = true ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set: installed copies couldn't verify this update."; exit 1; }
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$tools/sparkle.tar.xz" -C "$tools" ./bin/sign_update
          key="$RUNNER_TEMP/update.key"
          printf '%s' "$UPDATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          # The zip: its signature and length go into the appcast.
          attributes=$("$tools/bin/sign_update" --ed-key-file "$key" dist/Strata.zip)
          [[ "$attributes" =~ ^sparkle:edSignature=\"[A-Za-z0-9+/=]+\"\ length=\"[0-9]+\"$ ]] || { echo "::error::unexpected sign_update output"; exit 1; }
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Strata.app/Contents/Info.plist)
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' build/Strata.app/Contents/Info.plist)
          date=$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')
          # The notes in the update window, or else a link to the release page.
          if [ -s "$RUNNER_TEMP/notes.html" ]; then
            notes="<description><![CDATA[$(cat "$RUNNER_TEMP/notes.html")]]></description>"
          else
            notes="<sparkle:releaseNotesLink>https://github.com/$REPOSITORY/releases/tag/$TAG</sparkle:releaseNotesLink>"
          fi
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Strata</title>
              <item>
                <title>Strata $VERSION</title>
                <pubDate>$date</pubDate>
                <sparkle:version>$build</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$minimum</sparkle:minimumSystemVersion>
                $notes
                <enclosure url="https://github.com/$REPOSITORY/releases/download/$TAG/Strata.zip" $attributes type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          # The feed itself is signed too (Info.plist requires it), so nobody can point installed copies elsewhere.
          "$tools/bin/sign_update" --ed-key-file "$key" --disable-signing-warning dist/appcast.xml
          xmllint --noout dist/appcast.xml
          cat dist/appcast.xml

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          retention-days: ${{ env.RELEASE_TAG != '' && 7 || inputs.retention_days }}
          if-no-files-found: error
          # A disk image and a zip are already compressed.
          compression-level: 0

      - name: Remove the temporary keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
          sparse-checkout: docs/release-notes

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          # A pre-release is never "latest", so its appcast never reaches installed copies.
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          notes="docs/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          assets=(dist/Strata.dmg dist/Strata.zip dist/SHA256SUMS.txt)
          if [ -f dist/appcast.xml ]; then assets+=(dist/appcast.xml); fi
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "Strata $VERSION" --verify-tag "${flags[@]}"
